trigger:
  branches:
    include:
    - main
  paths:
    include:
    - 'config/projects/**'
    - 'config/variable-groups/**'

parameters:
- name: projectConfig
  type: string
  default: 'config/projects/default.yaml'

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: common-variables

stages:
- stage: SetupVariableGroups
  displayName: 'Setup Variable Groups'
  jobs:
  - job: CreateVariableGroups
    displayName: 'Create Variable Groups'
    steps:
    - task: AzureCLI@2
      displayName: 'Create Common Variables Group'
      inputs:
        azureSubscription: '$(AZURE_SUBSCRIPTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Read common variables
          COMMON_VARS=$(cat config/variable-groups/common-variables.yaml)

          # Create common variables group
          az pipelines variable-group create \
            --name "common-variables" \
            --description "Common variables for all projects" \
            --variables "$COMMON_VARS" \
            --authorize true

- stage: CreateProject
  displayName: 'Create Azure DevOps Project'
  dependsOn: SetupVariableGroups
  jobs:
  - job: CreateProject
    displayName: 'Create Project and Setup'
    steps:
    - task: AzureCLI@2
      displayName: 'Create Azure DevOps Project'
      inputs:
        azureSubscription: '$(AZURE_SUBSCRIPTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Read project configuration
          PROJECT_NAME=$(yq e '.project_name' ${{ parameters.projectConfig }})
          SUBSCRIPTION_ID=$(yq e '.subscription_id' ${{ parameters.projectConfig }})
          TENANT_ID=$(yq e '.tenant_id' ${{ parameters.projectConfig }})
          LOCATION=$(yq e '.location' ${{ parameters.projectConfig }})
          DESCRIPTION=$(yq e '.description' ${{ parameters.projectConfig }})
          VISIBILITY=$(yq e '.visibility' ${{ parameters.projectConfig }})

          # Create Azure DevOps project
          az devops project create --name "$PROJECT_NAME" --description "$DESCRIPTION" --visibility "$VISIBILITY"

          # Create service connection
          az devops service-endpoint azurerm create \
            --azure-rm-service-principal-id "$(ARM_CLIENT_ID)" \
            --azure-rm-subscription-id "$SUBSCRIPTION_ID" \
            --azure-rm-subscription-name "$(ARM_SUBSCRIPTION_NAME)" \
            --azure-rm-tenant-id "$TENANT_ID" \
            --name "$PROJECT_NAME-connection" \
            --project "$PROJECT_NAME"

    - task: CopyFiles@2
      displayName: 'Copy Pipeline Templates'
      inputs:
        Contents: |
          pipelines/templates/**
        TargetFolder: '$(Build.ArtifactStagingDirectory)/templates'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Pipeline Templates'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/templates'
        artifact: 'pipeline-templates'
        publishLocation: 'pipeline'

- stage: SetupPipelines
  displayName: 'Setup Project Pipelines'
  dependsOn: CreateProject
  jobs:
  - job: SetupPipelines
    displayName: 'Create Basic Pipelines'
    steps:
    - task: AzureCLI@2
      displayName: 'Create Infrastructure Pipeline'
      inputs:
        azureSubscription: '$(AZURE_SUBSCRIPTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          PROJECT_NAME=$(yq e '.project_name' ${{ parameters.projectConfig }})

          # Create infrastructure pipeline
          az pipelines create \
            --name "Infrastructure" \
            --project "$PROJECT_NAME" \
            --repository "$(Build.Repository.Name)" \
            --branch main \
            --yaml-path "pipelines/infrastructure.yml"

          # Create application pipeline
          az pipelines create \
            --name "Application" \
            --project "$PROJECT_NAME" \
            --repository "$(Build.Repository.Name)" \
            --branch main \
            --yaml-path "pipelines/application.yml" 
