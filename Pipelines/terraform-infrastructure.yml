parameters:
- name: projectConfig
  type: string
  default: 'environments/projects/default/config.yaml'
- name: projectName
  type: string
- name: projectDescription
  type: string
  default: 'Project created and managed by Terraform'

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - DevOps-pipeline/modules/ado-project-setup/**
    - DevOps-pipeline/Pipelines/terraform-infrastructure.yml
    - DevOps-pipeline/environments/**

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: common-variables
- group: sensitive-variables
- name: TF_VAR_project_name
  value: ${{ parameters.projectName }}
- name: TF_VAR_project_description
  value: ${{ parameters.projectDescription }}

stages:
- stage: Validate
  displayName: 'Validate Terraform'
  jobs:
  - job: Validate
    displayName: 'Validate Terraform Configuration'
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/DevOps-pipeline/modules/ado-project-setup'
        backendServiceArm: '$(AZURE_SUBSCRIPTION)'
        backendAzureRmResourceGroupName: '$(RESOURCE_GROUP_NAME)'
        backendAzureRmStorageAccountName: '$(STORAGE_ACCOUNT)'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'ado-project-setup.tfstate'

    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/DevOps-pipeline/modules/ado-project-setup'
        environmentServiceNameAzureRM: '$(AZURE_SUBSCRIPTION)'

- stage: Plan
  displayName: 'Plan Terraform'
  dependsOn: Validate
  jobs:
  - job: Plan
    displayName: 'Plan Terraform Changes'
    steps:
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/DevOps-pipeline/modules/ado-project-setup'
        environmentServiceNameAzureRM: '$(AZURE_SUBSCRIPTION)'

- stage: Apply
  displayName: 'Apply Terraform'
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - job: Apply
    displayName: 'Apply Terraform Changes'
    steps:
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/DevOps-pipeline/modules/ado-project-setup'
        environmentServiceNameAzureRM: '$(AZURE_SUBSCRIPTION)'
