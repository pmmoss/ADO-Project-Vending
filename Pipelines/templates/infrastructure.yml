trigger:
  branches:
    include:
    - main
  paths:
    include:
    - 'terraform/**'

pool:
  vmImage: '$(BUILD_AGENT_POOL)'

variables:
- group: common-variables

stages:
- stage: Validate
  displayName: 'Validate Terraform'
  jobs:
  - job: Validate
    displayName: 'Validate Terraform Configuration'
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '$(TERRAFORM_VERSION)'

    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        backendServiceArm: '$(AZURE_SUBSCRIPTION)'
        backendAzureRmResourceGroupName: '$(RESOURCE_GROUP)'
        backendAzureRmStorageAccountName: '$(STORAGE_ACCOUNT)'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'infrastructure.tfstate'

    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        environmentServiceNameAzureRM: '$(AZURE_SUBSCRIPTION)'

- stage: Plan
  displayName: 'Plan Terraform'
  dependsOn: Validate
  jobs:
  - job: Plan
    displayName: 'Plan Terraform Changes'
    steps:
    - task: TerraformTaskV4@4
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        environmentServiceNameAzureRM: '$(AZURE_SUBSCRIPTION)'

- stage: Apply
  displayName: 'Apply Terraform'
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: Apply
    displayName: 'Apply Terraform Changes'
    environment: '$(ENVIRONMENT)'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TerraformTaskV4@4
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              environmentServiceNameAzureRM: '$(AZURE_SUBSCRIPTION)'
